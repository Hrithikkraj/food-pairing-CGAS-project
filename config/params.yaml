# Global pipeline parameters for Flavor-Nutrition Pairing Project
seed: 42
min_compounds: 10
low_pct: 10.0
high_pct: 20.0
n_perm: 5000
n_boot: 2000
min_recipes_per_cuisine: 50
min_pair_recipes: 20
min_pair_recipes_cuisine: 5

# Cutoff grid for sensitivity analysis
sensitivity_cutoffs:
  - [5.0, 15.0]
  - [10.0, 20.0]
  - [10.0, 25.0]
  - [15.0, 30.0]

# High-frequency or problematic compounds to filter out
filter_compounds:
  - 951  # farnesol

filter_ingredients:
  - 339  # farnesol ingredient

